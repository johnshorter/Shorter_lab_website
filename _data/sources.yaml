# Nature genetics: Genome-wide association analyses identify distinct genetic architec...
- id: pubmed:41233554
  image: images/journals/nature-genetics.png
  description: Depression that starts early in life and depression that starts later are partly different at the genetic level. Our genome-wide association analyses found distinct genetic architectures for early-onset and late-onset depression, which points to partly different biology depending on the age when depression begins.

