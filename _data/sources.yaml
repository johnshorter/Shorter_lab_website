# To add a paper, add one entry with its DOI (or PubMed ID) and push:
#   - id: doi:10.1234/example.5678
# CI then fetches the title, authors, journal and date automatically (Manubot).
#
# Optional fields per paper (these override what Manubot finds):
#   image:        journal cover, hosted locally under images/journals/
#   description:  plain-language summary shown under the citation
#   date / link:  fix a wrong date or point at a better landing page
# To hide a paper, delete its entry.

