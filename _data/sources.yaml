# JAMA Psychiatry: Population-Based Risk of Psychiatric Disorders Associated With Recu...
- id: doi:10.1001/jamapsychiatry.2024.1453
  type: paper
  date: 2024-10-2
  image: images/journals/jama-psychiatry.png
  description: Recurrent copy number variants (rCNVs) are stretches of DNA that are deleted or duplicated in some people and have been linked to psychiatric disorders. Using the population-based Danish iPSYCH case-cohort, we found that many rCNVs are more common, and carry less risk of ADHD, autism, and schizophrenia-spectrum disorders, than earlier case-control studies suggested. No rCNV raised the risk of depression. Risk depended on how large the affected region was and how sensitive its genes are to disruption, not on whether DNA was lost or gained.

